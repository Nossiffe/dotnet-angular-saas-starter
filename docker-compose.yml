name: saas
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas}
      POSTGRES_DB: ${POSTGRES_DB:-saas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [devnet]

  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on: [db]
    networks: [devnet]

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # UI web
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
    networks: [devnet]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-saas};Username=${POSTGRES_USER:-saas};Password=${POSTGRES_PASSWORD:-saas}"
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-dev-only-change-me-0123456789abcdef}"
      App__BaseUrl: "${APP_BASEURL:-http://localhost:4200}"
      Email__Host: mailpit
      Email__Port: 1025
    ports:
      - "${API_PORT:-5123}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [devnet]

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "${ASPIRE_UI_PORT:-18888}:18888"
      - "${OTLP_PORT:-4317}:18889"
    networks: [devnet]

volumes:
  db-data:

networks:
  devnet:
    name: devnet
    external: true
