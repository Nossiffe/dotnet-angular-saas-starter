name: saas
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas}
      POSTGRES_DB: ${POSTGRES_DB:-saas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [devnet]

  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on: [db]
    networks: [devnet]

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # UI web
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
    networks: [devnet]

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "${ASPIRE_UI_PORT:-18888}:18888"
      - "${OTLP_PORT:-4317}:18889"
    networks: [devnet]

volumes:
  db-data:

networks:
  devnet:
    name: devnet
    external: true
