<h1>Produits</h1>
<form (submit)="$event.preventDefault(); add()" style="display:flex; gap:1rem; align-items:baseline">
  <mat-form-field appearance="outline">
    <mat-label>Nom</mat-label>
    <input matInput [value]="name()" (input)="name.set($any($event.target).value)" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Prix</mat-label>
    <input matInput type="number" [value]="price()" (input)="price.set(+$any($event.target).value)" />
  </mat-form-field>
  <button mat-flat-button color="primary" type="submit">Ajouter</button>
</form>

@if (svc.products.isLoading()) { <p>Chargement…</p> }
@else if (svc.products.error()) { <p>Échec du chargement.</p> }
@else if (svc.products.hasValue()) {
  <table mat-table [dataSource]="svc.products.value()!">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let p">{{ p.name }}</td>
    </ng-container>
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Prix</th>
      <td mat-cell *matCellDef="let p">{{ p.price | currency:'EUR' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let p"><button mat-button (click)="remove(p.id)">Supprimer</button></td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>
  </table>
}
