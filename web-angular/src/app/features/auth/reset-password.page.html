<div class="card auth-card">
  <h1>Réinitialiser le mot de passe</h1>
  @if (!userId() || !token()) {
    <p class="error">
      Lien invalide ou expiré. <a routerLink="/forgot-password">Demander un nouveau lien</a>
    </p>
  } @else {
    <form novalidate (submit)="onSubmit($event)">
      <mat-form-field appearance="outline">
        <mat-label>Nouveau mot de passe</mat-label>
        <input
          matInput
          type="password"
          [formField]="resetForm.newPassword"
          [errorStateMatcher]="errors.matcher"
        />
        <!-- Un seul élément racine dans le @if : mat-form-field le projette sous le champ. -->
        @if (errors.shown(resetForm.newPassword)) {
          <mat-error>{{ errors.text(resetForm.newPassword) }}</mat-error>
        }
      </mat-form-field>
      @if (serverError()) {
        <p class="error">{{ serverError() }}</p>
      }
      <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Enregistrement…' : 'Enregistrer le mot de passe' }}
      </button>
    </form>
  }
</div>
