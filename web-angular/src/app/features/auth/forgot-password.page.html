<h1>Mot de passe oublié</h1>
@if (sent()) {
  <p class="success">Si un compte existe pour cette adresse, un email a été envoyé.</p>
  <p><a routerLink="/login">Retour à la connexion</a></p>
} @else {
  <form novalidate (submit)="onSubmit($event)">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input
        matInput
        type="email"
        [formField]="forgotForm.email"
        [errorStateMatcher]="errors.matcher"
      />
      <!-- Un seul élément racine dans le @if : mat-form-field le projette sous le champ. -->
      @if (errors.shown(forgotForm.email)) {
        <mat-error>{{ errors.text(forgotForm.email) }}</mat-error>
      }
    </mat-form-field>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Envoi…' : 'Envoyer' }}
    </button>
  </form>
  <p><a routerLink="/login">Retour à la connexion</a></p>
}
