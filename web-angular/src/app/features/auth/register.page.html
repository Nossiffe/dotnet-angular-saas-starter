<h1>Inscription</h1>
<form novalidate (submit)="onSubmit($event)">
  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input
      matInput
      type="email"
      [formField]="registerForm.email"
      [errorStateMatcher]="errors.matcher"
    />
    <!-- Un seul élément racine dans le @if : mat-form-field le projette sous le champ. -->
    @if (errors.shown(registerForm.email)) {
      <mat-error>{{ errors.text(registerForm.email) }}</mat-error>
    }
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Mot de passe</mat-label>
    <input
      matInput
      type="password"
      [formField]="registerForm.password"
      [errorStateMatcher]="errors.matcher"
    />
    <!-- Un seul élément racine dans le @if : mat-form-field le projette sous le champ. -->
    @if (errors.shown(registerForm.password)) {
      <mat-error>{{ errors.text(registerForm.password) }}</mat-error>
    }
  </mat-form-field>
  @if (serverError()) {
    <p class="error">{{ serverError() }}</p>
  }
  <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
    Créer le compte
  </button>
</form>
<p>Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
