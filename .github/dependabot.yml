# Grouped dependency updates, weekly, with a 7-day cooldown: a release must be
# at least a week old before Dependabot proposes it (supply-chain safety net).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web-angular"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@angular-eslint/*"]
        update-types: ["minor", "patch"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
        # Pre-1.0 package: minor releases may break, so it keeps its own PR.
        exclude-patterns: ["@hey-api/openapi-ts"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Zurich"
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Zurich"
    labels: ["dependencies"]
    groups:
      docker:
        patterns: ["*"]
