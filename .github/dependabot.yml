# Grouped dependency updates, weekly, with a 7-day cooldown: a release must be
# at least a week old before Dependabot proposes it (supply-chain safety net).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web-angular"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@angular-eslint/*", "angular-eslint"]
        update-types: ["minor", "patch"]
      # vitest and its plugins must move together, majors included.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Security updates of vitest and @vitest/mocker in a single attempt.
      # @vitest/coverage-v8 has no advisory but requires the exact vitest
      # version: if the update still fails, bump both by hand (security/README.md).
      vitest-security:
        applies-to: security-updates
        patterns: ["vitest", "@vitest/*"]
      npm-minor-patch:
        # The catch-all group. When a dependency matches several groups, a group with patterns
        # gives it up to a more specific group, while a group without patterns gives up nothing
        # and scores 500, above wildcard patterns such as "@angular/*" (95) or "@vitest/*" (94).
        # Without "*", which scores 1, this group kept the Angular packages and
        # @vitest/coverage-v8 away from their own groups.
        patterns: ["*"]
        update-types: ["minor", "patch"]
        # Pre-1.0 package: minor releases may break, so it keeps its own PR.
        exclude-patterns: ["@hey-api/openapi-ts"]
    ignore:
      # Angular pins the TypeScript range it supports (>=6.0 <6.1 for Angular 22):
      # TypeScript moves with `ng update`, not on its own.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Angular majors need the `ng update` migrations.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    groups:
      docker:
        patterns: ["*"]
