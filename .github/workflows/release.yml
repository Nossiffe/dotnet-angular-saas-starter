name: Release — Build & push image GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # SBOM générés AVANT l'attestation : cette dernière échoue par construction
      # sur un repo privé hors GitHub Enterprise (attest-build-provenance requiert
      # un plan Enterprise pour la transparence log privée) — un échec attendu à
      # cette étape ne doit pas priver de leurs SBOM les images déjà poussées sur
      # GHCR (le job continue au-delà d'un step en échec seulement si ce dernier a
      # `continue-on-error`, mais ici on évite carrément la dépendance d'ordre).
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          # release (tag) workflow : caching desactive explicitement
          # (cache-poisoning — https://docs.zizmor.sh/audits/#cache-poisoning)
          # note : `package-manager-cache` n'existe pas encore en tant qu'input
          # sur actions/setup-node v4 (no-op aujourd'hui) — il devient actif dès
          # le bump v5 (Dependabot ouvrira la PR) ; laissé en place volontairement
          # pour ce jour-là.
          package-manager-cache: false
      - name: SBOM backend (CycloneDX)
        run: |
          dotnet tool restore
          dotnet tool run dotnet-CycloneDX -- Saas.slnx -o sbom --filename sbom-backend.json --json
      - name: SBOM fronts (npm sbom natif)
        run: |
          (cd web-angular && npm ci --ignore-scripts && npm sbom --sbom-format cyclonedx --omit dev > ../sbom/sbom-web-angular.json)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/*.json

      - name: Attestation de provenance (SLSA build L2)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

# NOTE : Ce workflow construit et pousse l'image sur GHCR.
# Le déploiement effectif (vers le runtime : k8s, ECS, VM, etc.) est à brancher
# selon la cible — ajouter une étape "deploy" après le push, ou déclencher
# un autre workflow/pipeline via `workflow_dispatch` ou un webhook.
