name: Release — Build & push image GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # SBOM produits avant l'attestation de provenance : si celle-ci échoue (dépôt
      # privé hors GitHub Enterprise), les SBOM de l'image poussée restent publiés.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Pas de cache npm dans un workflow de release (empoisonnement de cache,
          # https://docs.zizmor.sh/audits/#cache-poisoning).
          package-manager-cache: false
      - name: SBOM backend (CycloneDX)
        run: |
          dotnet tool restore
          dotnet tool run dotnet-CycloneDX -- Saas.slnx -o sbom --filename sbom-backend.json --json
      - name: SBOM fronts (npm sbom natif)
        run: |
          (cd web-angular && npm ci --ignore-scripts && npm sbom --sbom-format cyclonedx --omit dev > ../sbom/sbom-web-angular.json)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/*.json

      - name: Attestation de provenance (SLSA build L2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

# NOTE : Ce workflow construit et pousse l'image sur GHCR.
# Le déploiement effectif (vers le runtime : k8s, ECS, VM, etc.) est à brancher
# selon la cible — ajouter une étape "deploy" après le push, ou déclencher
# un autre workflow/pipeline via `workflow_dispatch` ou un webhook.
