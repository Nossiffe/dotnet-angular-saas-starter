name: Generator

on:
  push:
    paths:
      - 'tools/**'
      - 'Dockerfile'
      - 'src/**'
      - 'web-angular/**'
      - 'web-react/**'
      - '.github/**'
      - '*.yml'
      - '*.json'
      - '*.toml'
      - '.env.example'
      - 'lefthook.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'Dockerfile'
      - 'src/**'
      - 'web-angular/**'
      - 'web-react/**'
      - '.github/**'
      - '*.yml'
      - '*.json'
      - '*.toml'
      - '.env.example'
      - 'lefthook.yml'
      - 'docker-compose.yml'

permissions:
  contents: read

jobs:
  test-generator:
    name: Test Generator (both fronts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'

      - name: Install python3-yaml (for YAML validation)
        run: pip install pyyaml --quiet

      - name: Run generator test (angular + react)
        run: bash scripts/test-generator.sh
