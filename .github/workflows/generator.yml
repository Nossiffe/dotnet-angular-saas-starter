name: Generator

on:
  push:
    paths:
      - 'tools/**'
      - 'Dockerfile'
      - 'src/**'
      - 'web-angular/**'
      - 'web-react/**'
      - '.github/**'
      - '*.yml'
      - '*.json'
      - '*.toml'
      - '.env.example'
      - 'lefthook.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'Dockerfile'
      - 'src/**'
      - 'web-angular/**'
      - 'web-react/**'
      - '.github/**'
      - '*.yml'
      - '*.json'
      - '*.toml'
      - '.env.example'
      - 'lefthook.yml'
      - 'docker-compose.yml'

jobs:
  test-generator:
    name: Test Generator (both fronts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install python3-yaml (for YAML validation)
        run: pip install pyyaml --quiet

      - name: Run generator test (angular + react)
        run: bash scripts/test-generator.sh
