name: CI

on:
  push:
    branches: [main, plan-*]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  doc-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Doc-lint (chemins/ports/endpoints)
        run: bash scripts/check-docs.sh

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet build
      # Microsoft Testing Platform natif (global.json §test) : couverture via l'extension
      # Microsoft.Testing.Extensions.CodeCoverage — options passées directement (sans « -- »).
      - run: dotnet test --coverage --coverage-output-format cobertura --results-directory ./coverage
      - name: Résumé couverture
        run: |
          # defusedxml : les parseurs XML stdlib sont vulnérables XXE/billion-laughs par
          # défaut — ici l'entrée est auto-générée par Microsoft.CodeCoverage dans ce même
          # job, mais le template modélise la bonne pratique.
          pip install --quiet defusedxml
          python3 - <<'EOF'
          import glob
          import os
          import defusedxml.ElementTree as ET

          # MTP nomme les fichiers <guid>.cobertura.xml (un par projet de test), à plat
          # dans --results-directory — glob sur *.cobertura.xml (≠ coverage.cobertura.xml VSTest).
          files = sorted(glob.glob("coverage/**/*.cobertura.xml", recursive=True))
          covered = sum(int(ET.parse(f).getroot().get("lines-covered")) for f in files)
          valid = sum(int(ET.parse(f).getroot().get("lines-valid")) for f in files)
          rate = (covered / valid * 100) if valid else 0.0
          print(f"Couverture lignes backend : {rate:.1f}% ({covered}/{valid}, {len(files)} projet(s))")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Couverture backend : {rate:.1f}% (lignes, {covered}/{valid} sur {len(files)} projet(s))\n")
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-backend
          path: coverage/**/*.cobertura.xml

  web-angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-angular
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-angular/package-lock.json
      - run: npm ci
      - run: npm run api:gen
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e-angular:
    runs-on: ubuntu-latest
    # Specs are front-only: navigate to /login, check DOM/a11y — no backend required.
    defaults:
      run:
        working-directory: web-angular
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-angular/package-lock.json
      - run: npm ci
      - run: npm run api:gen # client Hey API généré (gitignoré, absent du checkout)
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

