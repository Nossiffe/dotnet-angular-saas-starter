name: CI

on:
  push:
    branches: [main, plan-*]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet build
      - run: dotnet test

  web-angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-angular/package-lock.json
      - run: npm ci
      - run: npm run api:gen
      - run: npm run check
      - run: npm test
      - run: npm run build
