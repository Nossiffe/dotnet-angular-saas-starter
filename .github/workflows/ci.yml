name: CI

on:
  push:
    branches: [main, plan-*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  doc-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Doc-lint (chemins/ports/endpoints)
        run: bash scripts/check-docs.sh

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'
      - run: dotnet build
      - run: dotnet test --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Résumé couverture
        run: |
          # defusedxml : les parseurs XML stdlib sont vulnérables XXE/billion-laughs par
          # défaut — ici l'entrée est auto-générée par coverlet dans ce même job, mais le
          # template modélise la bonne pratique.
          pip install --quiet defusedxml
          python3 - <<'EOF'
          import glob
          import os
          import defusedxml.ElementTree as ET

          files = sorted(glob.glob("coverage/**/coverage.cobertura.xml", recursive=True))
          covered = sum(int(ET.parse(f).getroot().get("lines-covered")) for f in files)
          valid = sum(int(ET.parse(f).getroot().get("lines-valid")) for f in files)
          rate = (covered / valid * 100) if valid else 0.0
          print(f"Couverture lignes backend : {rate:.1f}% ({covered}/{valid}, {len(files)} projet(s))")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Couverture backend : {rate:.1f}% (lignes, {covered}/{valid} sur {len(files)} projet(s))\n")
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-backend
          path: coverage/**/coverage.cobertura.xml

  web-angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-angular
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-angular/package-lock.json
      - run: npm ci
      - run: npm run api:gen
      - run: npm run check
      - run: npm test
      - run: npm run build

  web-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e-angular:
    runs-on: ubuntu-latest
    # Specs are front-only: navigate to /login, check DOM/a11y — no backend required.
    defaults:
      run:
        working-directory: web-angular
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-angular/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  e2e-react:
    runs-on: ubuntu-latest
    # Specs are front-only: navigate to /login, check DOM/a11y — no backend required.
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
