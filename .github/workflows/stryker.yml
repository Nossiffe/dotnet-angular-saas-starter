name: Stryker (mutation testing)

on:
  schedule:
    - cron: '0 3 * * 1' # lundi 03h UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # NON-BLOQUANT (continue-on-error) — Stryker.NET 4.16 ne supporte pas le
  # runner natif Microsoft Testing Platform (MTP) utilisé par cette stack
  # (global.json §test + UseMicrosoftTestingPlatformRunner sur xunit.v3).
  #   - Depuis la bascule MTP native (2026-07-13) : Stryker DÉTECTE MTP sur les
  #     projets de test et ABANDONNE la découverte des tests —
  #     « Test discovery has been aborted », « Number of tests found: 0 »,
  #     « Test assemblies do not contain any test, skipping ». Échec franc en
  #     ~70 s, aucun rapport produit (≠ VsTest requis par Stryker 4.16).
  #     Upstream : stryker-mutator/stryker-net#3094 (support MTP — issue de
  #     suivi ; message d'erreur explicite pointant dessus).
  #   - Historique (mode VSTest via xunit.runner.visualstudio, avant bascule) :
  #     le run allait au bout mais les scores étaient des artefacts —
  #     Application 97.84 % tout-Timeout (0 Killed / 226 Timeout),
  #     Domain 0.00 % tout-Survived (124/124). Voir #3117 et #3629.
  # Dans les deux cas : AUCUN signal de mutation exploitable tant que
  # stryker-net ne supporte pas MTP. Le job reste câblé (cron hebdo +
  # workflow_dispatch) comme sonde : dès qu'un run produit de vrais compteurs
  # Killed (≠ 0), le support MTP sera arrivé → retirer ce continue-on-error.
  # Réévaluer à chaque montée de dotnet-stryker (Renovate ouvrira les PRs) et
  # surveiller #3094.
  # ---------------------------------------------------------------------------
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'
      - run: dotnet tool restore
      - name: Stryker — Application
        run: dotnet stryker -f stryker-config.json
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stryker-report-application
          path: StrykerOutput/**/reports/*.html
      - name: Nettoyer StrykerOutput avant le run Domain
        if: always()
        run: rm -rf StrykerOutput
      - name: Stryker — Domain
        if: always()
        run: dotnet stryker -f stryker-config-domain.json
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stryker-report-domain
          path: StrykerOutput/**/reports/*.html
