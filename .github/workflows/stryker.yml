name: Stryker (mutation testing)

# Mutation testing sur les tests unitaires : chaque semaine, à la demande, et sur
# les PR qui touchent le Domain ou ses tests (job stryker-domain seul, 1 à 2 min).
# - stryker-domain : bloquant. Le run échoue sous le seuil `break` de
#   stryker-config-domain.json.
# - stryker-application : mesuré seulement (seuil `break` à 0), hors PR. Ses handlers sont
#   couverts par les tests d'intégration sur PostgreSQL, que Stryker ne lance pas : un score
#   bas y est attendu et n'est pas un signal de régression.
# Stryker tourne depuis le projet de tests unitaires avec le runner Microsoft
# Testing Platform (`test-runner: mtp`), celui des projets xunit.v3.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Domain/**'
      - 'src/tests/UnitTests/**'
      - 'stryker-config-domain.json'
      - '.config/dotnet-tools.json'
      - 'Directory.Packages.props'
      - '.github/workflows/stryker.yml'
  schedule:
    - cron: '0 3 * * 1' # lundi 03h UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker-domain:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/tests/UnitTests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
      - run: dotnet tool restore
      - run: dotnet stryker -f ../../../stryker-config-domain.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stryker-report-domain
          path: src/tests/UnitTests/StrykerOutput/**/reports/*.html

  stryker-application:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/tests/UnitTests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
      - run: dotnet tool restore
      - run: dotnet stryker -f ../../../stryker-config-application.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stryker-report-application
          path: src/tests/UnitTests/StrykerOutput/**/reports/*.html
