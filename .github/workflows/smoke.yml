name: Smoke

# Parcours de bout en bout de l'API (PostgreSQL, Mailpit, Hangfire) via scripts/smoke.sh.
# Lancé sur main, à la demande et sur les PR qui touchent le backend : le job `changes`
# évite ce job coûteux pour les PR purement front. `smoke` est une vérification exigée sur
# main : un filtre `paths` sur `pull_request` laisserait les autres PR sans statut, en
# attente indéfinie, alors qu'un job ignoré par son `if` compte comme réussi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Sur une PR : le backend change-t-il ? Mêmes motifs que l'ancien filtre `paths`.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # le commit de fusion et ses deux parents : la base et la tête de la PR
      - name: Fichiers modifiés par la PR
        id: diff
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/pr-changes.sh backend \
            'src/**' \
            'Directory.Packages.props' \
            'scripts/smoke.sh' \
            'docker-compose.yml'

  smoke:
    needs: changes
    # Toujours hors PR (push sur main, manuel). Sur une PR, smoke n'est ignoré que si
    # `changes` a réussi et répondu `false` : un échec de la détection, ou une sortie absente,
    # le fait tourner. `!cancelled()` remplace le `success()` implicite, qui ignorerait ce job
    # dès que `changes` est ignoré ou échoue.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.backend != 'false') }}
    runs-on: ubuntu-24.04
    env:
      # Reprendre les mêmes valeurs que .env (sans secrets sensibles)
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
      POSTGRES_PORT: 5432
      MAILPIT_UI_PORT: 8025
      MAILPIT_SMTP_PORT: 1025
      API_PORT: 5123

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Démarrer Postgres + Mailpit (docker compose)
        run: docker compose up -d db mailpit

      - name: Attendre que Postgres soit prêt
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U saas >/dev/null 2>&1; then
              echo "Postgres prêt"
              break
            fi
            echo "Attente Postgres ($i/30)..."
            sleep 2
          done

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Restaurer les outils .NET locaux (dotnet-ef)
        run: dotnet tool restore

      - name: Build
        run: dotnet build

      - name: Migration EF
        run: |
          dotnet ef database update \
            --project src/Infrastructure \
            --startup-project src/Api \
            --no-build
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=saas;Username=saas;Password=saas"

      - name: Démarrer l'API en arrière-plan
        run: |
          ASPNETCORE_URLS="http://localhost:$API_PORT" \
          ASPNETCORE_ENVIRONMENT=Development \
          ConnectionStrings__Default="Host=localhost;Port=5432;Database=saas;Username=saas;Password=saas" \
          Email__Host=localhost \
          Email__Port=$MAILPIT_SMTP_PORT \
          Database__MigrateOnStartup=false \
          Jwt__SigningKey="ci-smoke-only-not-a-secret-0123456789abcdef0123456789abcdef" \
          dotnet run --project src/Api --no-build &
          echo "API_PID=$!" >> $GITHUB_ENV

      - name: Attendre /health/ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:$API_PORT/health/ready" >/dev/null 2>&1; then
              echo "API prête"
              break
            fi
            echo "Attente API ($i/30)..."
            sleep 3
          done

      - name: Exécuter smoke.sh
        run: bash scripts/smoke.sh "$API_PORT"
        env:
          MAILPIT_UI_PORT: ${{ env.MAILPIT_UI_PORT }}
          # Clé factice CI uniquement (base jetable du runner) — pas un secret.
          Jwt__SigningKey: ci-smoke-only-not-a-secret-0123456789abcdef0123456789abcdef

      - name: Teardown (API + Docker)
        if: always()
        run: |
          kill "$API_PID" 2>/dev/null || true
          docker compose down
