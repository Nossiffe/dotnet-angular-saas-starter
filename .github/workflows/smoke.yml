name: Smoke

# Déclencheur : workflow_dispatch + push sur main + PR ciblées backend.
# Rationale : le smoke est lourd (Postgres + Mailpit + API complète + Hangfire).
# Avant, limité à main pour économiser les ressources. Maintenant, on le lance aussi
# sur les PR qui touchent le backend (src/, Directory.Packages.props, scripts/smoke.sh,
# docker-compose.yml) pour attraper les régressions d'intégration avant merge.
# Le filtre `paths:` maintient le coût maîtrisé : PRs front-only bypassen le smoke.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Directory.Packages.props'
      - 'scripts/smoke.sh'
      - 'docker-compose.yml'
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # Reprendre les mêmes valeurs que .env (sans secrets sensibles)
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
      POSTGRES_PORT: 5432
      MAILPIT_UI_PORT: 8025
      MAILPIT_SMTP_PORT: 1025
      API_PORT: 5123

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Créer le réseau Docker partagé
        run: docker network create devnet 2>/dev/null || true

      - name: Démarrer Postgres + Mailpit (docker compose)
        run: docker compose up -d db mailpit

      - name: Attendre que Postgres soit prêt
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U saas >/dev/null 2>&1; then
              echo "Postgres prêt"
              break
            fi
            echo "Attente Postgres ($i/30)..."
            sleep 2
          done

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'

      - name: Restaurer les outils .NET locaux (dotnet-ef)
        run: dotnet tool restore

      - name: Build (--no-restore si cache disponible)
        run: dotnet build

      - name: Migration EF
        run: |
          dotnet ef database update \
            --project src/Infrastructure \
            --startup-project src/Api \
            --no-build
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=saas;Username=saas;Password=saas"

      - name: Démarrer l'API en arrière-plan
        run: |
          ASPNETCORE_URLS="http://localhost:$API_PORT" \
          ASPNETCORE_ENVIRONMENT=Development \
          ConnectionStrings__Default="Host=localhost;Port=5432;Database=saas;Username=saas;Password=saas" \
          Email__Host=localhost \
          Email__Port=$MAILPIT_SMTP_PORT \
          Database__MigrateOnStartup=false \
          dotnet run --project src/Api --no-build &
          echo "API_PID=$!" >> $GITHUB_ENV

      - name: Attendre /health/ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:$API_PORT/health/ready" >/dev/null 2>&1; then
              echo "API prête"
              break
            fi
            echo "Attente API ($i/30)..."
            sleep 3
          done

      - name: Exécuter smoke.sh
        run: bash scripts/smoke.sh "$API_PORT"
        env:
          MAILPIT_UI_PORT: ${{ env.MAILPIT_UI_PORT }}

      - name: Teardown (API + Docker)
        if: always()
        run: |
          kill "$API_PID" 2>/dev/null || true
          docker compose down
