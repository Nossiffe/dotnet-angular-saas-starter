name: Dependencies audit (CVE)

# dotnet-audit et npm-audit sont des vérifications exigées sur main. Le workflow se déclenche
# donc sur toutes les PR, sans filtre `paths` : un workflow filtré ne poste aucun statut et la
# PR attendrait indéfiniment. Le job `changes` décide si les audits tournent ; un job ignoré
# par son `if` compte comme réussi.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # lundi 05h UTC — attrape les CVE publiées sans changement de code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Sur une PR : un manifeste de dépendances change-t-il ? Mêmes motifs que l'ancien filtre `paths`.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      manifests: ${{ steps.diff.outputs.manifests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # le commit de fusion et ses deux parents : la base et la tête de la PR
      - name: Fichiers modifiés par la PR
        id: diff
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/pr-changes.sh manifests \
            'Directory.Packages.props' \
            '**/packages.lock.json' \
            '**/package-lock.json' \
            '**/package.json'

  dotnet-audit:
    needs: changes
    # Toujours hors PR (cron, manuel). Sur une PR, l'audit n'est ignoré que si `changes` a
    # réussi et répondu `false` : un échec de la détection, ou une sortie absente, le fait
    # tourner. `!cancelled()` remplace le `success()` implicite, qui ignorerait ce job dès
    # que `changes` est ignoré ou échoue.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.manifests != 'false') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # commentaire d'échec sur la PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
      - name: Restore
        # NuGetAudit=false : ce restore sert uniquement à alimenter l'audit ci-dessous,
        # qui fait lui-même le tri de sévérité (High/Critical bloquant). Les avis
        # remontés par le restore feraient doublon dans le log.
        run: dotnet restore Saas.slnx -p:NuGetAudit=false
      - name: Audit NuGet (fail sur High/Critical, direct + transitif)
        run: |
          # `dotnet list package --vulnerable` peut sortir en exit non nul dès qu'une
          # CVE existe (quelle que soit sa sévérité) — c'est le parseur Python
          # ci-dessous qui décide du seuil bloquant (High/Critical), pas cette commande.
          dotnet list Saas.slnx package --vulnerable --include-transitive --format json > audit.json || true
          cat audit.json
          HIGH=$(python3 - <<'EOF'
          import json
          data = json.load(open('audit.json'))
          count = 0
          for project in data.get('projects', []):
              for framework in project.get('frameworks', []) or []:
                  for kind in ('topLevelPackages', 'transitivePackages'):
                      for package in framework.get(kind, []) or []:
                          for vulnerability in package.get('vulnerabilities', []) or []:
                              if vulnerability.get('severity') in ('High', 'Critical'):
                                  print(f"::error::{package['id']} {vulnerability.get('severity')} {vulnerability.get('advisoryurl','')}")
                                  count += 1
          print(count)
          EOF
          )
          HIGH=$(echo "$HIGH" | tail -1)
          if [ "$HIGH" != "0" ]; then
            echo "::error::$HIGH vulnérabilité(s) High/Critical NuGet — voir security/deps-review-TEMPLATE.md pour documenter une exception"
            exit 1
          fi
      - name: Commentaire PR (échec audit)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "⛔ **deps-audit** : vulnérabilité(s) High/Critical détectée(s) — voir le log du job \`dotnet-audit\` de ce run. Corriger (bump/pin) ou documenter une exception datée via \`security/deps-review-TEMPLATE.md\`."

  npm-audit:
    needs: changes
    # Même condition que dotnet-audit.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.manifests != 'false') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-angular
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Audit npm (prod deps, fail sur high/critical)
        run: npm audit --omit=dev --audit-level=high
