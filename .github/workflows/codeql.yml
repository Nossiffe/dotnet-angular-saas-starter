name: CodeQL (SAST)

# DÉSACTIVÉ en automatique (2026-07-13) : CodeQL exige GitHub Advanced Security
# sur un repo privé — l'upload des résultats échoue systématiquement sans licence.
# RÉACTIVER (rétablir les triggers push/pull_request/schedule ci-dessous) si :
#   - le repo devient public (CodeQL gratuit), OU
#   - une licence GHAS / GitHub Code Security est activée sur le repo.
# Triggers d'origine :
#   push:         branches: [main]
#   pull_request: branches: [main]
#   schedule:     cron "30 1 * * 1" (lundi 01h30 UTC)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          category: "/language:${{ matrix.language }}"
