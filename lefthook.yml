pre-commit:
  parallel: true
  commands:
    # Bloquant dès que gitleaks est installé. Sans gitleaks, le hook prévient et laisse
    # passer : le job Secret Scanning de la CI reste le filet de sécurité.
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --no-banner --config .gitleaks.toml
        else
          echo "gitleaks absent : scan local des secrets ignoré (la CI le fait)."
        fi
      fail_text: "Secret détecté par gitleaks — supprimer la valeur sensible avant de commiter"
    dotnet-format:
      glob: "**/*.cs"
      run: dotnet format --include {staged_files} --verify-no-changes
      fail_text: "Code C# non formaté — lance: dotnet format"
    web-prettier:
      root: "web-angular/"
      glob: "*.{ts,html,scss,json}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    web-eslint:
      root: "web-angular/"
      glob: "*.ts"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    build:
      run: dotnet build
