pre-commit:
  parallel: true
  commands:
    dotnet-format:
      glob: "**/*.cs"
      run: dotnet format --include {staged_files} --verify-no-changes
      fail_text: "Code C# non formaté — lance: dotnet format"
    web-prettier:
      root: "web-angular/"
      glob: "*.{ts,html,scss,json}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    web-eslint:
      root: "web-angular/"
      glob: "*.ts"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    react-prettier:
      root: "web-react/"
      glob: "*.{ts,tsx,css,json}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    react-eslint:
      root: "web-react/"
      glob: "*.{ts,tsx}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    build:
      run: dotnet build
