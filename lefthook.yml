pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: command -v gitleaks >/dev/null 2>&1 && gitleaks protect --staged --redact --no-banner --config .gitleaks.toml || true
      fail_text: "Secret détecté par gitleaks — supprimer la valeur sensible avant de commiter"
    dotnet-format:
      glob: "**/*.cs"
      run: dotnet format --include {staged_files} --verify-no-changes
      fail_text: "Code C# non formaté — lance: dotnet format"
    web-prettier:
      root: "web-angular/"
      glob: "*.{ts,html,scss,json}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    web-eslint:
      root: "web-angular/"
      glob: "*.ts"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    build:
      run: dotnet build
