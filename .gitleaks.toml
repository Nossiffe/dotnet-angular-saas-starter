# gitleaks configuration — allowlist for known-safe files
# See: https://github.com/gitleaks/gitleaks#configuration

[allowlist]
description = "Allowlist pour les fichiers de placeholder et snapshots"
paths = [
  # Fichiers d'exemple — pas de vraies valeurs secrètes
  '''.env\.example$''',
  '''web-angular/\.env\.example$''',
  # Snapshots OpenAPI (pas de secrets dans les schémas)
  '''openapi\.json$''',
]
