# Configuration gitleaks (hook pre-commit et job Secret Scanning de la CI).
# Voir https://github.com/gitleaks/gitleaks#configuration

# Garde toutes les règles par défaut : sans cette section, un fichier de configuration
# remplace les règles par défaut et gitleaks ne détecte plus rien.
[extend]
useDefault = true

[allowlist]
description = "Fichiers d'exemple et faux positifs connus"
paths = [
  # Fichier d'exemple : valeurs factices de développement
  '''\.env\.example$''',
  # Contrat OpenAPI : aucun secret dans les schémas
  '''openapi\.json$''',
]
regexes = [
  # Nom d'algorithme dans un commentaire (Infrastructure/DependencyInjection.cs)
  '''^PBKDF2-SHA512$''',
  # Clé de signature factice des tests d'intégration
  '''^integration-tests-signing-key-[0-9a-f]+$''',
]
